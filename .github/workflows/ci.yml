name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Resolve dependencies
        run: go mod tidy
      - name: Run tests
        run: go test ./...
      - name: Build API
        run: go build ./cmd/api
