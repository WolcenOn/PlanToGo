<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>PlanToGo — Tus planes, por grupos</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="current-date">Hoy</p>
        <h1>Hola, Alex</h1>
      </div>
      <button class="icon-button" type="button" aria-label="Abrir perfil y ajustes">A</button>
    </header>

    <main class="dashboard" id="main-content">
      <section class="attention" aria-labelledby="attention-title">
        <div class="section-heading">
          <div><p class="section-kicker">Prioridad</p><h2 id="attention-title">Necesita tu atención</h2></div>
          <span class="count-badge" id="attention-count" aria-label="3 elementos pendientes">3</span>
        </div>
        <div class="card-list" id="attention-list"></div>
      </section>

      <section aria-labelledby="today-title">
        <div class="section-heading">
          <div><p class="section-kicker">Agenda</p><h2 id="today-title">Hoy</h2></div>
          <button class="text-button" type="button" data-view="calendar">Ver calendario</button>
        </div>
        <div class="timeline" id="today-list"></div>
      </section>

      <section aria-labelledby="upcoming-title">
        <div class="section-heading"><div><p class="section-kicker">Tu semana</p><h2 id="upcoming-title">Próximamente</h2></div></div>
        <div class="day-groups" id="upcoming-list"></div>
      </section>

      <section aria-labelledby="groups-title">
        <div class="section-heading">
          <div><p class="section-kicker">Tus espacios</p><h2 id="groups-title">Tus grupos</h2></div>
          <button class="text-button" type="button" data-view="groups">Ver todos</button>
        </div>
        <div class="group-grid" id="groups-list"></div>
      </section>
    </main>

    <button class="new-plan-button" id="create-plan" type="button" aria-label="Crear un nuevo plan"><span aria-hidden="true">＋</span>Nuevo plan</button>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="bottom-nav__item is-active" type="button" data-view="home" aria-current="page"><span aria-hidden="true">⌂</span>Inicio</button>
      <button class="bottom-nav__item" type="button" data-view="calendar"><span aria-hidden="true">▦</span>Calendario</button>
      <button class="bottom-nav__item" type="button" data-view="groups"><span aria-hidden="true">◉</span>Grupos</button>
      <button class="bottom-nav__item" type="button" data-view="more"><span aria-hidden="true">•••</span>Más</button>
    </nav>

    <div class="toast" id="status" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
